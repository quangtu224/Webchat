<!doctype html>
<!--
  Chat page - static shell.
  The message list is empty on purpose: src/ui.ts fills it at runtime.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebChat</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <!-- ===== APP SHELL: splits the page into two columns ===== -->
    <div class="app">
      <!-- ===== LEFT COLUMN: room list ===== -->
      <aside class="sidebar">
        <div class="sidebar__brand">
          <span class="logo">W</span>
          <span>WebChat</span>
        </div>

        <nav class="sidebar__rooms">
          <h2 class="sidebar__title">Rooms</h2>
          <ul>
            <!-- Currently open room: the "is-active" class drives the highlight -->
            <li><a class="room is-active" href="#">general</a></li>
            <li><a class="room" href="#">wbs-projekt</a></li>
            <li><a class="room" href="#">devops</a></li>
            <li><a class="room" href="#">random</a></li>
          </ul>
        </nav>

        <div class="sidebar__user">
          <span class="avatar avatar--me">QT</span>
          <span>Quang Tu</span>
        </div>
      </aside>

      <!-- ===== RIGHT COLUMN: chat pane ===== -->
      <main class="chat">
        <!-- Header bar -->
        <header class="chat__header">
          <h1>#general</h1>
          <p>Anything and everything</p>
        </header>

        <!-- Message list -->
        <div class="messages">
          <!-- Rendered by src/ui.ts -->
        </div>

        <!-- Message composer -->
        <form class="composer">
          <input type="text" placeholder="Message #general" aria-label="Message content" />
          <button type="submit">Send</button>
        </form>
      </main>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
